name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  docs:
    name: vitepress build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 仓库提交的是 package-lock.json（Dockerfile 也走 npm），没有 bun.lock：
      # 用 npm ci 才能按已提交的锁文件做可复现安装。
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: npm ci
        run: npm ci
      - name: vitepress build
        run: npm run build
      - name: 导航与口径检查（title=H1、frontmatter 齐备、站内链接可达）
        run: node scripts/check-nav.mjs
  secrets-scan:
    name: gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
